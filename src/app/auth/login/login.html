@if (isOpen()) {
  <!-- Overlay -->
  <div class="modal modal-open">
    <div class="modal-box bg-base-200 shadow-fsc">
      <h3 class="font-bold text-lg text-center mb-4">Connexion</h3>

      <!-- Message d'erreur -->
      @if (errorMessage()) {
        <div class="alert alert-error mb-4">
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Formulaire -->
      <div class="grid grid-cols-1 md:grid-cols-[auto_1fr] items-center gap-x-4 gap-y-3">
        <label class="text-sm font-medium">Email</label>
        <input
          type="email"
          placeholder="ton@email.com"
          class="input input-bordered"
          [(ngModel)]="formData.email"
          name="email"
        />

        <label class="text-sm font-medium">Mot de passe</label>
        <input
          type="password"
          placeholder="••••••••"
          class="input input-bordered"
          [(ngModel)]="formData.password"
          name="password"
        />
      </div>

      <!-- Actions -->
      <div class="modal-action flex-col gap-2">
        <button class="btn btn-primary w-full" (click)="submit()" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="loading loading-spinner loading-sm"></span>
          } @else {
            Connexion
          }
        </button>

        <p class="text-center text-sm">
          Pas encore de compte ?
          <button class="link link-primary" (click)="switchToRegister()">S'inscrire</button>
        </p>

        <button class="btn btn-ghost btn-sm" (click)="close()">Annuler</button>
      </div>
    </div>

    <!-- Clic outside pour fermer -->
    <div class="modal-backdrop" (click)="close()"></div>
  </div>
}
